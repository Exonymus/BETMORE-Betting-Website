<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="initial-scale=1, width=device-width"/>
    <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="icon" type="image/x-icon" href="img/title-icon.png">
    <link rel="stylesheet" href="css/global.css"/>
    <link rel="stylesheet" href="css/signup.css"/>
    <title>Sign Up</title>
</head>
<body>
<div class="page-signup-wrapper">
    <div class="page-signup">
        <header class="page-signup__header">
            <nav class="page-signup__header__content navbar">
                <span class="navbar__brand">
                    <img class="brand__name" alt="" src="img/logos/site-logo.svg"/>
                </span>

                <nav class="navbar navbar-expand-lg navbar-light bg-light">
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                            data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                            aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
                        <ul class="collapse__nav__content h6">
                            <li class="nav-link" id="page-home">
                                <a href="index.html" id="nav-link-home" class="link">Home</a>
                            </li>
                            <li class="nav-link d-none" id="page-profile">
                                <a href="profile.html" class="link">Profile</a>
                            </li>
                            <li class="nav-link d-none" id="page-deposit">
                                <a href="deposit.html" class="link">Deposit</a>
                            </li>
                            <li class="nav-link d-none" id="page-withdraw">
                                <a href="withdraw.html" class="link">Withdraw</a>
                            </li>
                            <li class="nav-link" id="page-aboutus">
                                <a href="about.html" class="link">About Us</a>
                            </li>
                            <li class="nav-link" id="page-signIn">
                                <a href="signin.html" class="link">Sign-In</a>
                            </li>
                            <li class="nav-link" id="page-signUp">
                                <a href="signup.html" class="link link--current">Sign-Up</a>
                            </li>
                            <li class="nav-link d-none" id="page-signOut">
                                <a href="index.html" class="link">Sign-Out</a>
                            </li>
                        </ul>
                    </div>
                </nav>
                <div class="user-info d-none h6">
                        <span class="user-info__coins">
                            <img src="img/logos/coin.svg"  class="user__money" alt="">
                            <span id="user-coins">1000</span>
                        </span>
                    <span class="user-info__gems">
                            <img src="img/logos/nolos.svg" class="user__money" alt="">
                            <span id="user-gems">1000</span>
                         </span>
                </div>
                <div class="navbar__search h6">
                    <form class="form-inline navbar__search__content">
                        <input class="form-control mr-sm-2 search__input" type="search" placeholder="Search..."
                               aria-label="Search">
                        <button class="search__button"></button>
                    </form>
                </div>
            </nav>
        </header>
        <main class="page-signup__main">
            <section class="main__auth-data">
                <header class="auth-data__header">
                    <b>SIGN UP</b>
                </header>
                <main class="auth-data__main">
                    <form class="main__form" method="post" id="authForm" name="signup">
                        <input
                                class="form__input-field"
                                id="email"
                                type="email"
                                placeholder="Email"
                                required/>
                        <input
                                class="form__input-field"
                                id="pass"
                                type="password"
                                placeholder="Password"
                                minlength="8"
                                required/>
                        <input
                                class="form__input-field"
                                id="pass--repeat"
                                type="password"
                                placeholder="Repeat password"
                                minlength="8"
                                required/>

                        <input class="hidden" type="file" id="avatar" accept="image/*"/>
                        <label class="paragraph form__input-file" for="avatar">Click to upload the avatar</label>
                        <label class="form-check-label terms-check align-items-center" for="acceptTerms">
                            <input type="checkbox" class="form-check-input" id="acceptTerms" name="acceptTerms" required>
                            I accept the <a href="aboutus.html" target="_blank">Terms and Conditions</a>
                        </label>
                        <button class="form__submit-btn" type="submit">
                            <b class="submit-btn__text">Sign Up</b>
                        </button>
                    </form>
                </main>
                <footer class="auth-data__footer">
                    <a class="auth-data__footer__link" href="signin.html">
                        Already a JukeBox user? Sign In
                    </a>
                </footer>
            </section>
            <img class="auth__logo logo" alt="" src="img/logos/signup-logo.svg" id="sign-up__img"/>
        </main>
        <footer class="page-signup__footer">
            <div class="footer-content">
                <img src="img/logos/default-user.webp" alt="" class="footer__logo">
                <div class="users-statistics">
                    <p class="users-count">10000</p>
                    <h3>Users Registered</h3>
                </div>
            </div>
        </footer>
    </div>
</div>

<!--Scripts-->
<script type="module" src="js/global.mjs"></script>
<script type="module" src="js/auth.mjs"></script>

<!--Libraries-->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
<script src="https://unpkg.com/@popperjs/core@2"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>
</html>
