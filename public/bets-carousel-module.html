<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="initial-scale=1, width=device-width"/>

    <!--Libraries-->
    <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.0.3/css/font-awesome.css' rel='stylesheet'>

    <!--Styles-->
    <link rel="stylesheet" href="css/global.css"/>
    <link rel="stylesheet" href="css/bets-carousel-module.css">
    <link rel="stylesheet" href="css/bet-card.css">
    <style>
        .iframe-container {
            display: flex;
            justify-content: space-between;
            transition: transform 0.5s ease-out
        }

        .iframe-container iframe {
            width: 48%; /* Adjust the width as needed */
            height: 360px; /* Adjust the height as needed */
        }
    </style>
    <title>Bets Carousel</title>
</head>
<body class="module">
<div id="bets-carousel" class="carousel carousel-dark slide">
    <div class="carousel-main">
        <button class="carousel-control-prev" type="button" data-bs-target="#bets-carousel"
                data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <div class="carousel-inner">
            <div class="carousel-item active" data-bs-interval="10000">
                <div class="iframe-container">
                    <iframe src="bet-card.html" frameborder="0"></iframe>
                    <iframe src="bet-card.html" frameborder="0"></iframe>
                </div>
            </div>
            <div class="carousel-item" data-bs-interval="2000">
                <div class="iframe-container">
                    <iframe src="bet-card.html" frameborder="0"></iframe>
                    <iframe src="bet-card.html" frameborder="0"></iframe>
                </div>
            </div>
            <div class="carousel-item" data-bs-interval="2000">
                <div class="iframe-container">
                    <iframe src="bet-card.html" frameborder="0"></iframe>
                    <iframe src="bet-card.html" frameborder="0"></iframe>
                </div>
            </div>
            <div class="carousel-item" data-bs-interval="2000">
                <div class="iframe-container">
                    <iframe src="bet-card.html" frameborder="0"></iframe>
                    <iframe src="bet-card.html" frameborder="0"></iframe>
                </div>
            </div>
        </div>
        <button class="carousel-control-next" type="button" data-bs-target="#bets-carousel"
                data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>
    <div class="carousel-indicators">
        <button type="button" data-bs-target="#bets-carousel" data-bs-slide-to="0" class="active"
                aria-current="true" aria-label="Slide 1"></button>
        <button type="button" data-bs-target="#bets-carousel" data-bs-slide-to="1"
                aria-label="Slide 2"></button>
        <button type="button" data-bs-target="#bets-carousel" data-bs-slide-to="2"
                aria-label="Slide 3"></button>
        <button type="button" data-bs-target="#bets-carousel" data-bs-slide-to="3"
                aria-label="Slide 3"></button>
    </div>
</div>

<!--Libraries-->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
<script src="https://unpkg.com/@popperjs/core@2"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>


<!--Scripts-->
<script type="module" src="js/bet-card.mjs"></script>
<script>
    // TODO: Refactor and check scripts
    // Function to handle messages from iframes
    function handleMessage(event) {
        // Check if the message is from the bet card iframe
        if (event.data.action === 'openBetOverlay') {
            // Open the bet overlay in the index.html
            window.parent.postMessage({
                action: event.data.action,
                bet_id: event.data.bet_id,
                bet_coef: event.data.bet_coef
            }, '*');
        }
        if (event.data.action === 'coefSelected') {
            unselectAllCoefficients(event.source);
        }
    }

    // Listen for messages from iframes
    window.addEventListener('message', handleMessage);

    function unselectAllCoefficients(sourceIframe) {
        var iframes = document.querySelectorAll('iframe');
        iframes.forEach(function (iframe) {
            if (iframe.contentWindow !== sourceIframe) {
                // Access the content of the iframe and unselect the coefficient
                iframe.contentWindow.postMessage({ action: 'unselectCoefficients' }, '*');
            }
        });
    }
</script>
</body>
</html>
