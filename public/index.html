<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="initial-scale=1, width=device-width"/>

    <!--Libraries-->
    <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.0.3/css/font-awesome.css' rel='stylesheet'>
    <link rel="icon" type="image/x-icon" href="img/title-icon.png">

    <!--Styles-->
    <link rel="stylesheet" href="css/global.css"/>
    <link rel="stylesheet" href="css/index.css"/>

    <title>BETMORE</title>
</head>
<body>
<div class="page-home-wrapper">
    <div class="page-home">
        <header class="page-home__header">
            <nav class="page-home__header__content navbar">
                <span class="navbar__brand">
                    <img class="brand__name" alt="" src="img/logos/site-logo.svg"/>
                </span>

                <nav class="navbar navbar-expand-lg navbar-light bg-light">
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                            data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                            aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
                        <ul class="collapse__nav__content h6">
                            <li class="nav-link" id="page-home">
                                <a href="index.html" id="nav-link-home" class="link link--current">Home</a>
                            </li>
                            <li class="nav-link d-none" id="page-profile">
                                <a href="profile.html" class="link">Profile</a>
                            </li>
                            <li class="nav-link d-none" id="page-deposit">
                                <a href="deposit.html" class="link">Deposit</a>
                            </li>
                            <li class="nav-link d-none" id="page-withdraw">
                                <a href="withdraw.html" class="link">Withdraw</a>
                            </li>
                            <li class="nav-link" id="page-aboutus">
                                <a href="about.html" class="link">About Us</a>
                            </li>
                            <li class="nav-link" id="page-signIn">
                                <a href="signin.html" class="link">Sign-In</a>
                            </li>
                            <li class="nav-link" id="page-signUp">
                                <a href="signup.html" class="link">Sign-Up</a>
                            </li>
                            <li class="nav-link d-none" id="page-signOut">
                                <a href="index.html" class="link">Sign-Out</a>
                            </li>
                        </ul>
                    </div>
                </nav>
                <div class="user-info d-none h6">
                        <span class="user-info__coins">
                            <img src="img/logos/coin.svg"  class="user__money" alt="">
                            <span id="user-coins">1000</span>
                        </span>
                    <span class="user-info__gems">
                            <img src="img/logos/nolos.svg" class="user__money" alt="">
                            <span id="user-gems">1000</span>
                         </span>
                </div>
                <div class="navbar__search h6">
                    <form class="form-inline navbar__search__content">
                        <input class="form-control mr-sm-2 search__input" type="search" placeholder="Search..."
                               aria-label="Search">
                        <button class="search__button"></button>
                    </form>
                </div>
            </nav>
        </header>

        <main class="page-home__betting-carousel">
            <section class="betting-carousel__bet-zone">
                <header>
                    <div class="sport-buttons">
                        <button id="cs-go-button">CS:GO</button>
                        <button id="dota2-button">DOTA2</button>
                        <button id="lol-button">LOL</button>
                        <button id="valorant-button">Valorant</button>
                    </div>
                </header>
                <main>
                    <div class="carousel-container">
                        <!--                    Bets Categories-->
                        <div class="nav nav-tabs carousel-category" id="nav-tab" role="tablist">
                            <button class="nav-link active bet-category"
                                    id="live-bets__tab"
                                    data-bs-toggle="tab" data-bs-target="#live-bets"
                                    type="button" role="tab"
                                    aria-controls="live-bets"
                                    aria-selected="true">Live Bets</button>
                            <button class="nav-link bet-category"
                                    id="pre-bets__tab"
                                    data-bs-toggle="tab" data-bs-target="#pre-bets"
                                    type="button" role="tab"
                                    aria-controls="pre-bets"
                                    aria-selected="false">Pre-Bets</button>
                        </div>
                        <!--                    Loading Screen-->
                        <iframe
                                id="loading-screen__ifr"
                                src="loading__screen-module.html"
                                class="bets__carousel-module"
                                width="1200"
                                height="400">
                        </iframe>
                        <div class="tab-content" id="nav-tabContent">
                            <div class="tab-pane fade show active"
                                 id="live-bets"
                                 role="tabpanel"
                                 aria-labelledby="live-bets__tab">
                                <!--                    Live Bets Carousel-->
                                <iframe
                                        id="live-bets__ifr"
                                        src="bets__carousel-module.html"
                                        class="bets__carousel-module d-none"
                                        width="1200"
                                        height="400">
                                </iframe>
                            </div>
                            <div class="tab-pane fade"
                                 id="pre-bets"
                                 role="tabpanel"
                                 aria-labelledby="pre-bets__tab">
                                <!--                    Pre-Bets Carousel-->
                                <iframe
                                        id="pre-bets__ifr"
                                        src="bets__carousel-module.html"
                                        class="bets__carousel-module d-none"
                                        width="1200"
                                        height="400">
                                </iframe>
                            </div>
                        </div>
                    </div>
                </main>

                <footer>

                </footer>
            </section>

            <!--        Chat-->
            <iframe
                    src="chat-module.html" class="chat-module"
                    frameborder="0"
                    width="400"
                    height="542">
            </iframe>
        </main>

    </div>
</div>

<!--Libraries-->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
<script src="https://unpkg.com/@popperjs/core@2"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>


<!--Scripts-->
<script>
    // Simulate loading delay (For Ignat to check loading screen)
    setTimeout(function () {
        // Remove the loading screen when content is ready
        document.querySelector('#loading-screen__ifr').classList.add('d-none');
        document.querySelector('#live-bets__ifr').classList.remove('d-none');
        document.querySelector('#pre-bets__ifr').classList.remove('d-none');
    }, 1500); // 2000 milliseconds (2 seconds) delay for demonstration purposes
</script>
</body>
</html>
