                                <iframe

                                        src="bets-carousel.html"

                                   placeholder="0"
                                   min="1"
                                   max="10000"
                                   step="1">
                            <br>
                            <div class="form-check form-switch bet-insurance">

                            </div>

                            <br>

                            </button>
